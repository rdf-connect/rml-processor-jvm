plugins {
    id 'java'
    id 'maven-publish'
    id "io.github.goooler.shadow" version "8.1.8"
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
	maven { url = 'https://jitpack.io' }
}

group = "org.example"
version = "0.0.2"

dependencies {
    implementation 'com.google.protobuf:protobuf-java:4.28.2'
	implementation 'com.github.rmlio:rmlmapper-java:master-SNAPSHOT'
	implementation 'com.github.rdf-connect.jvm-runner:types:f5b6df6'

    implementation 'org.apache.jena:jena-core:5.0.0'
    implementation "org.apache.jena:jena-arq:5.0.0"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

shadowJar {
    mergeServiceFiles()
    dependencies {
        exclude(dependency('com.github.rdf-connect.jvm-runner:types:.*'))
        exclude(dependency('com.google.protobuf:.*'))
    }
    zip64 = true
    from("index.ttl") {
        into("") // root of jar
    }
}
// Standalone `rml-map` CLI (org.example.RmlMap): a self-contained fat jar that,
// unlike shadowJar, keeps the rdf-connect types and protobuf the runner would
// otherwise provide. Run it through bin/rml-map.
tasks.register('cliJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveFileName = 'rml-map.jar'
    from sourceSets.main.output
    configurations = [project.configurations.runtimeClasspath]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
    mergeServiceFiles()
    zip64 = true
    manifest {
        attributes 'Main-Class': 'org.example.RmlMap'
    }
}

configurations.all {
    resolutionStrategy {
        force "org.ow2.asm:asm:9.6"
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            // fat jar
            artifact(tasks.shadowJar)
        }
    }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

build {
    dependsOn shadowJar
}

test {
    useJUnitPlatform()
}

